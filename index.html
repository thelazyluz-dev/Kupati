<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="הארנק שלי" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <title>הארנק שלי 🐷</title>
  </head>
  <body>
    <div id="root">
      <div id="load-msg" style="font-family:sans-serif;text-align:center;padding:40px;color:#555;direction:ltr">
        <div style="font-size:48px">🐷</div>
        <p>Loading...</p>
      </div>
    </div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('load-msg');
        if (el) {
          el.innerHTML = '<div style="color:red;font-size:13px;word-break:break-all;text-align:left;background:#fee;padding:12px;border-radius:8px">'
            + '<b>JS Error:</b><br>' + msg + '<br><small>' + src + ':' + line + '</small></div>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('load-msg');
        if (el) {
          el.innerHTML = '<div style="color:red;font-size:13px;word-break:break-all;text-align:left;background:#fee;padding:12px;border-radius:8px">'
            + '<b>Promise Error:</b><br>' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
